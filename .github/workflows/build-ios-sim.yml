name: Build iOS Simulator

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.6'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build simulator app
        run: flutter build ios --simulator --debug --no-codesign

      - name: Zip Runner.app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app OmniTunnel-ios-simulator.zip

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: OmniTunnel-ios-simulator
          path: OmniTunnel-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14